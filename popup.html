<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<script src="functionality/constants.js" type="text/javascript"></script>
	<script src="functionality/popup.js" type="text/javascript"></script>
	<link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
	<div class="body">
		<div class="top-bar">
			<div class="title-group">
				<img class="logo-img" src="./icons/icon-128x128.png" alt="Arboria logo">
				<div class="logo-text">Arboria Carbon Tracker</div>
			</div>
			<div class="top-actions">
				<div class="toggle-row">
					<label class="toggle" data-tooltip="Toggle tracking">
						<input type="checkbox" id="tracking-toggle" aria-label="Toggle tracking" />
						<span class="toggle-pill"></span>
					</label>
					<button id="open-settings" class="icon-button" aria-label="Settings">
						<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
							<path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path>
							<path d="M19.4 13a7.6 7.6 0 0 0 .04-2l2-1.55a.5.5 0 0 0 .12-.64l-1.9-3.3a.5.5 0 0 0-.6-.22l-2.36.96a7.8 7.8 0 0 0-1.73-1l-.36-2.52a.5.5 0 0 0-.5-.42h-3.8a.5.5 0 0 0-.5.42l-.36 2.52a7.8 7.8 0 0 0-1.73 1l-2.36-.96a.5.5 0 0 0-.6.22l-1.9 3.3a.5.5 0 0 0 .12.64l2 1.55a7.6 7.6 0 0 0 0 2l-2 1.55a.5.5 0 0 0-.12.64l1.9 3.3c.14.24.44.34.7.22l2.36-.96a7.8 7.8 0 0 0 1.73 1l.36 2.52c.04.24.25.42.5.42h3.8c.25 0 .46-.18.5-.42l.36-2.52a7.8 7.8 0 0 0 1.73-1l2.36.96c.26.12.56.02.7-.22l1.9-3.3a.5.5 0 0 0-.12-.64L19.4 13Z"></path>
						</svg>
					</button>
				</div>
			</div>
		</div>
		<hr>

		<div class="annual-row">
			<div class="forecast">
				<div class="forecast-title">Annual Estimate</div>
				<div id="forecast-count">Not enough data...</div>
			</div>
		</div>

		<div class="summary">
			<div class="summary-card">
				<div class="summary-label">Today (CO<sub>2</sub>e)</div>
				<div id="today-carbon" class="summary-value">--</div>
			</div>
			<div class="summary-card">
				<div class="summary-label">Activity + Data</div>
				<div class="summary-metric"><span id="today-time">--</span> active</div>
				<div class="summary-metric"><span id="today-data">--</span> transfer</div>
			</div>
		</div>

		<div class="main-content">
			<div class="chart-caption" id="chart-caption">Data for the past 30 days:</div>
			<div class="chart-row">
				<div id="chart">
					<div id="chart-default">Not enough data yet...</div>
				</div>
			</div>
		</div>

		<div class="section-row">
			<div class="section">
				<div class="section-title">Top domains (all time)</div>
				<div id="domain-list" class="domain-list"></div>
			</div>

			<div class="section">
				<div class="section-title">Insights</div>
				<ul id="insights-list" class="insights-list"></ul>
			</div>
		</div>

		<div class="methodology">
			<div>Local-only tracking.</div>
			<div>
				Sources:
				<a href="https://sustainablewebdesign.org/calculating-digital-emissions/" target="_blank" rel="noreferrer">Sustainable Web Design</a>,
				<a href="https://httparchive.org/reports/page-weight#bytesTotal" target="_blank" rel="noreferrer">HTTP Archive</a>.
			</div>
		</div>

		<div id="toggle-toast" class="toast" role="status" aria-live="polite"></div>
	</div>
</body>

</html>
